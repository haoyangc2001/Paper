        - generic [ref=f1e41]: 智能控制·自主决策·智慧未来
        - generic [ref=f1e43]: 第39届中国控制与决策会议
        - generic [ref=f1e45]: 中国·长沙
        - generic [ref=f1e47]: 2027年5月14日—16日
      - generic [ref=f1e49]:
        - separator [ref=f1e51]
        - article [ref=f1e53]:
          - paragraph [ref=f1e54]: 第39届中国控制与决策会议（CCDC 2027）将于2027年5月14日-16日在中国长沙市举行。中国控制与决策会议是当前控制、系统、决策理论与相关技术领域的大型国际学术会议。会议旨在为从事相关领域科研与教育工作的国内外专家、学者及工程技术人员提供一个高水平的国际学术交流平台。会议交流形式有：大会报告、杰出讲座、高端论坛、主题研讨、专题辅导、分组报告和张贴论文等。会议指定交流语言为英文。本届会议由东北大学主办，中南大学、湖南大学、国防科技大学联合承办。在符合IEEE Xplore的范围和质量要求的前提下，被录用的英文论文将被提交到IEEE Xplore。 长沙，别称星城，为湖南省省会，系国家首批历史文化名城。这座城市历经三千年沧桑，城名与城址始终未改，是湖湘文化的重要发祥地，也是 “一带一路” 倡议中的重要节点城市。长沙坐拥山水洲城相融的独特风貌，岳麓书院、马王堆汉墓等历史文化瑰宝与现代创新科技交相辉映，先后荣获联合国教科文组织 “媒体艺术之都”、“东亚文化之都” 称号，并连续多年获评 “中国最具幸福感城市”。
        - separator [ref=f1e59]
