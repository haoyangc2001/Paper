      - article [ref=e38]:
        - heading "初稿提交" [level=1] [ref=e39]
        - heading "稿件要求" [level=2] [ref=e40]
        - paragraph [ref=e41]: 1.按照CCDC论文模板提交PDF版本。 2.初稿每篇文章不多于8页（包括图）。 3.终稿超过6页的部分需交纳超版费200元/页，终稿最长不能超过8页（包括图）。注：第一作者相同的第二篇论文有优惠。
        - heading "初稿提交步骤" [level=2] [ref=e42]
        - paragraph [ref=e43]:
          - text: 1.准备好您的论文全文pdf文件。 2.使用您的PIN和密码登录会议论文管理系统
          - link "http://cms.amss.ac.cn/" [ref=e44] [cursor=pointer]:
            - /url: http://cms.amss.ac.cn/
          - text: （第一次使用该系统的作者需注册一个账号（PIN），完成注册后，系统将会把登录PIN和密码发送到作者的电子信箱中）。 3.点击进入CCDC 2027“作者工作区”。 4.选择一个您要提交的投稿类型（参见下面投稿类型说明）开始投稿。
        - heading "IEEE收录说明" [level=2] [ref=e45]
        - paragraph [ref=e46]:
          - text: 1.在符合IEEE Xplore的收录范围和质量要求的前提下，被录用的英文论文可被收录到IEEE Xplore。
          - link "点击此处" [ref=e48] [cursor=pointer]:
            - /url: /_upload/tpl/01/4f/335/template335/htmlResCN/pdf/IEEE_Scope_CN.pdf
          - text: 查看IEEE Xplore收录范围。 2.中文论文只出版，无法被IEEE/EI收录。
