        - heading "投稿类型说明" [level=2] [ref=e81]
        - paragraph
        - generic [ref=e82]:
          - listitem [ref=e83]: Regular Paper (普通论文)
          - text: 普通论文（非邀请组论文）请在投稿时选择regular paper类型提交，特别专题论文请选择regular paper投稿并在研究领域里选择相应特别专题。
          - listitem [ref=e84]: Invited Session Proposal (邀请组申请书)
          - text: 如果您要组织邀请组，请先通过邮件secretary_ccdc@ise.neu.edu.cn.向秘书处提交1000字左右的申请书，组委会批准后选择Invited Session Proposal类型提交申请，提交后会系统会分配一个分组代码（Session code），请将这个代码告知邀请组的所有论文作者。邀请组申请书不需要提交终稿、不需要交注册费。
          - listitem [ref=e85]: Invited Session Paper (邀请组论文)
          - text: 邀请组论文提交时请选择Invited Session Paper，并必须填写分组代码（如果不知道，请联系邀请组组织者）。
          - listitem [ref=e86]: Position Paper
          - text: 只需提交长摘要，收录进论文集，但不送IEEE Xplore database、EI检索，不影响再次投稿。
